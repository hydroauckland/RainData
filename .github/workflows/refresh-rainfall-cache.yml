name: Refresh Auckland rainfall cache

on:
  schedule:
    # Runs daily at approximately 07:17 NZ daylight time
    # or 06:17 NZ standard time.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out RainData repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R packages
        run: |
          repos <- c(
            Auckland = "https://cran.stat.auckland.ac.nz",
            CRAN = "https://cloud.r-project.org"
          )

          options(repos = repos)

          required_packages <- c(
            "readxl",
            "rvest",
            "dplyr",
            "lubridate",
            "jsonlite"
          )

          missing_packages <- required_packages[
            !vapply(
              required_packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing_packages) > 0) {
            message(
              "Installing packages: ",
              paste(missing_packages, collapse = ", ")
            )

            install.packages(
              missing_packages,
              repos = repos,
              dependencies = TRUE
            )
          }

          missing_after_install <- required_packages[
            !vapply(
              required_packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing_after_install) > 0) {
            stop(
              "Failed to install required packages: ",
              paste(missing_after_install, collapse = ", ")
            )
          }

          message("All required R packages are available.")
        shell: Rscript {0}

      - name: Refresh station data from KiWIS and rainfall_sites
        run: Rscript refresh_rainfall_cache_github_profiles_fixed.R
        env:
          RAINFALL_CACHE_DIR: ${{ github.workspace }}/rainfall_cache
          RAINFALL_GITHUB_OWNER: hydroauckland
          RAINFALL_GITHUB_REPO: rainfall_sites
          RAINFALL_GITHUB_BRANCH: main

      - name: Commit updated cache files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f rainfall_cache/

          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Refresh rainfall cache"
            git push
          fi
