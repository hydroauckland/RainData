name: Refresh Auckland rainfall cache

on:
  schedule:
    # Runs daily at approximately 07:17 NZ daylight time / 06:17 NZ standard time.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # Pin the Linux image so runner-image changes are less likely to affect builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out RainData repository
        uses: actions/checkout@v7

      - name: Install system libraries needed by R source packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            gfortran \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libicu-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false

      - name: Install packages sequentially from official CRAN source
        run: |
          CRAN <- 'https://cran.r-project.org'
          options(
            repos = c(CRAN = CRAN),
            timeout = 600,
            download.file.method = 'libcurl'
          )

          # Install the core dependencies first so that a problem is reported
          # under the package that actually fails (for example curl or openssl),
          # rather than only reporting that httr could not be installed.
          packages <- c(
            'R6',
            'mime',
            'jsonlite',
            'curl',
            'openssl',
            'httr',
            'readxl',
            'dplyr',
            'lubridate',
            'rvest'
          )

          install_one_from_cran <- function(pkg) {
            message('==================================================')
            message('INSTALLING FROM CRAN SOURCE: ', pkg)
            message('CRAN repository: ', CRAN)

            utils::install.packages(
              pkgs = pkg,
              repos = CRAN,
              type = 'source',
              dependencies = NA,
              Ncpus = 2
            )

            if (!requireNamespace(pkg, quietly = TRUE)) {
              stop(
                'PACKAGE_INSTALL_FAILED: ', pkg,
                '. Review the installation output immediately above this message.'
              )
            }

            message(
              'PACKAGE_OK: ', pkg,
              ' version ', as.character(utils::packageVersion(pkg))
            )
          }

          for (pkg in packages) {
            install_one_from_cran(pkg)
          }

          # Explicit final check for everything directly used by the refresh script.
          required_packages <- c('readxl', 'rvest', 'dplyr', 'lubridate', 'jsonlite')
          missing <- required_packages[
            !vapply(required_packages, requireNamespace, logical(1), quietly = TRUE)
          ]
          if (length(missing) > 0L) {
            stop('Required packages failed final load check: ', paste(missing, collapse = ', '))
          }

          message('All required packages loaded. Installed package versions:')
          for (pkg in c(required_packages, 'httr', 'curl', 'openssl')) {
            message('  ', pkg, ': ', as.character(utils::packageVersion(pkg)))
          }
        shell: Rscript {0}

      - name: Refresh station data from KiWIS and rainfall_sites
        run: Rscript refresh_rainfall_cache_github_profiles_fixed.R
        env:
          RAINFALL_CACHE_DIR: ${{ github.workspace }}/rainfall_cache
          RAINFALL_GITHUB_OWNER: hydroauckland
          RAINFALL_GITHUB_REPO: rainfall_sites
          RAINFALL_GITHUB_BRANCH: main

      - name: Commit updated cache files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f rainfall_cache/
          if git diff --cached --quiet; then
            echo 'No cache changes to commit.'
          else
            git commit -m 'Refresh rainfall cache'
            git push
          fi
