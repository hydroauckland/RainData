name: Refresh Auckland rainfall cache

on:
  schedule:
    # 18:17 UTC = about 07:17 in NZ daylight time / 06:17 in NZ standard time.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out RainData repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install dependencies and rvest directly from CRAN
        run: |
          repos <- c(
            Auckland = "https://cran.stat.auckland.ac.nz",
            CRAN = "https://cloud.r-project.org"
          )
          options(repos = repos)

          # Install rvest's imported dependencies and the other packages
          # used by the rainfall cache refresher from CRAN repositories.
          packages_needed <- c(
            "readxl", "dplyr", "lubridate", "jsonlite",
            "cli", "glue", "httr", "lifecycle", "magrittr",
            "rlang", "selectr", "tibble", "xml2"
          )

          install.packages(
            packages_needed,
            repos = repos,
            dependencies = NA
          )

          missing_dependencies <- packages_needed[
            !vapply(
              packages_needed,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing_dependencies) > 0) {
            stop(
              "These dependencies failed to install: ",
              paste(missing_dependencies, collapse = ", ")
            )
          }

          # Download the actual CRAN source archive, not the HTML index page.
          rvest_url <- paste0(
            "https://cran.r-project.org/src/contrib/",
            "rvest_1.0.5.tar.gz"
          )
          rvest_tarball <- tempfile(fileext = ".tar.gz")

          download.file(
            rvest_url,
            destfile = rvest_tarball,
            mode = "wb",
            method = "libcurl",
            quiet = FALSE
          )

          if (!file.exists(rvest_tarball) || file.info(rvest_tarball)$size <= 0) {
            stop("The direct rvest CRAN download failed: ", rvest_url)
          }

          # Install rvest from the downloaded source archive.
          install.packages(
            rvest_tarball,
            repos = NULL,
            type = "source"
          )

          required_packages <- c(
            "readxl", "rvest", "dplyr", "lubridate", "jsonlite"
          )
          missing_packages <- required_packages[
            !vapply(
              required_packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing_packages) > 0) {
            stop(
              "Required packages unavailable after installation: ",
              paste(missing_packages, collapse = ", ")
            )
          }

          message("All required packages installed successfully.")
        shell: Rscript {0}

      - name: Refresh station data from KiWIS and rainfall_sites
        run: Rscript refresh_rainfall_cache_github_profiles_fixed.R
        env:
          RAINFALL_CACHE_DIR: ${{ github.workspace }}/rainfall_cache
          RAINFALL_GITHUB_OWNER: hydroauckland
          RAINFALL_GITHUB_REPO: rainfall_sites
          RAINFALL_GITHUB_BRANCH: main

      - name: Commit updated cache files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f rainfall_cache/

          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Refresh rainfall cache"
            git push
          fi
